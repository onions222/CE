[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wpa"
version = "0.1.0"
description = "White Point Adjustment reference implementation"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.22",
]

[project.optional-dependencies]
cli = ["pillow>=9.0"]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
