[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "wpa"
version = "0.1.0"
description = "White Point Adjustment — per-channel RGB gain with 12-bin luma-segmented gains"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
cli = ["Pillow>=9.0"]
dev = ["pytest>=7.0", "Pillow>=9.0"]

[project.scripts]
wpa = "wpa.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
